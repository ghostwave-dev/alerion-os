<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerion OS</title>
<style>
:root{
  --bg:#0b0f1a;
  --panel:rgba(18,22,34,.82);
  --win:#141926;
  --txt:#e8ecf5;
  --mut:#8b94a8;
  --line:rgba(255,255,255,.1);
  --acc:#34d399;
  --hov:rgba(255,255,255,.08);
  --tb-h:56px;
  --tb-top:calc(var(--tb-h) + env(safe-area-inset-top,0px));
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgba(245,247,252,.85);--win:#f7f8fc;--txt:#161b2a;--mut:#5d667a;--line:rgba(0,0,0,.12);--hov:rgba(0,0,0,.07);color-scheme:light}}
:root[data-theme="light"]{--panel:rgba(245,247,252,.85);--win:#f7f8fc;--txt:#161b2a;--mut:#5d667a;--line:rgba(0,0,0,.12);--hov:rgba(0,0,0,.07);color-scheme:light}
:root[data-theme="dark"]{--panel:rgba(18,22,34,.82);--win:#141926;--txt:#e8ecf5;--mut:#8b94a8;--line:rgba(255,255,255,.1);--hov:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:var(--tb-top)}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
#wall{position:fixed;inset:0;background-size:cover;transition:background .6s}
.w0{background:radial-gradient(1200px 700px at 20% 10%,#1e3a5f,transparent 60%),radial-gradient(900px 600px at 85% 85%,#0f5d4b,transparent 60%),#0b0f1a}
.w1{background:radial-gradient(1100px 700px at 80% 10%,#6d28d9,transparent 60%),radial-gradient(900px 600px at 10% 90%,#be185d,transparent 60%),#150b25}
.w2{background:linear-gradient(160deg,#0f2027,#203a43,#2c5364)}

#icons{position:fixed;left:0;top:var(--tb-top);bottom:env(safe-area-inset-bottom,0px);padding:14px;display:flex;flex-flow:column wrap;gap:6px;align-content:flex-start;z-index:1}
.ico{width:84px;padding:8px 4px;border-radius:10px;text-align:center;cursor:pointer;border:1px solid transparent;color:#fff;text-shadow:0 1px 4px #000}
.ico:hover{background:rgba(255,255,255,.12)}.ico .e{font-size:34px;display:block}.ico span.n{font-size:12px}

.win{position:fixed;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;resize:both;min-width:260px;min-height:180px;max-width:100vw;max-height:calc(100% - var(--tb-top));animation:pop .18s}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
.win.max{left:0!important;top:var(--tb-top)!important;width:100vw!important;height:calc(100% - var(--tb-top) - env(safe-area-inset-bottom,0px))!important;border-radius:0;resize:none}
.win.min{display:none}.win.act{border-color:var(--acc)}
.hd{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--panel);cursor:grab;touch-action:none;flex:none}
.hd b{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{width:28px;height:24px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-size:14px}
.wb:hover{background:var(--hov)}.wb.x:hover{background:#e5484d;color:#fff}
.bd{flex:1;overflow:auto;min-height:0;user-select:text}

/* Taskbar in BASSO con START a SINISTRA */
#tb{
  position:fixed;left:0;right:0;bottom:0;top:auto;
  height:calc(var(--tb-h) + env(safe-area-inset-bottom,0px));
  padding:0 10px env(safe-area-inset-bottom,0px) 10px;
  display:flex;align-items:center;gap:8px;
  background:var(--panel);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line);border-bottom:0;
  z-index:9000;
}
#tb .sp{display:none}
.tbtn{height:40px;min-width:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.tbtn:hover{background:var(--hov)}
.tbtn.on::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:3px;border-radius:3px;background:var(--acc)}
.tbtn.run::after{content:"";position:absolute;left:42%;right:42%;bottom:2px;height:3px;border-radius:3px;background:var(--mut)}

#start{position:relative;z-index:2;margin-right:auto;order:1;font-size:24px}

#tasks{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;gap:6px;
  max-width:calc(100vw - 260px);overflow-x:auto;scrollbar-width:none;z-index:1;
}
#tasks::-webkit-scrollbar{display:none}

.sys-pill{
  display:flex;align-items:center;gap:10px;
  height:40px;padding:0 14px;border-radius:14px;
  background:rgba(255,255,255,.09);
  border:1px solid var(--line);
  order:2;margin-left:auto;flex:none;
}
.sys-pill svg{display:block;flex:none}

#clock{flex:none;text-align:right;font-size:11px;line-height:1.15;padding:0 8px;color:var(--mut);order:3;cursor:pointer;border-radius:10px;height:40px;display:flex;flex-direction:column;justify-content:center}
#clock:hover{background:var(--hov)}
#clock b{display:block;color:var(--txt);font-size:13px;font-weight:600}

#err{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:100000;background:#e5484d;color:#fff;padding:8px 12px;border-radius:10px;display:none;font-size:13px}

/* Menu Start aperto SOPRA la taskbar in basso a sinistra */
#menu{
  position:fixed;left:10px;bottom:calc(var(--tb-h) + env(safe-area-inset-bottom,0px) + 8px);top:auto;
  width:min(360px,calc(100vw - 20px));max-height:70%;
  display:none;flex-direction:column;gap:8px;padding:12px;
  background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line);border-radius:16px;z-index:9001;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}
#menu.show{display:flex}
#q{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--hov);outline:0}
#q:focus{border-color:var(--acc)}
#apps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow:auto}
.mi{padding:10px 4px;border:0;border-radius:10px;background:transparent;cursor:pointer;text-align:center}
.mi:hover{background:var(--hov)}.mi .e{font-size:28px;display:block}.mi span.n{font-size:12px}
.pw{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;color:var(--mut);gap:6px;flex-wrap:wrap}
.pw button{border:0;background:var(--hov);border-radius:8px;padding:6px 10px;cursor:pointer;margin-left:4px}
.pw button:hover{background:#e5484d;color:#fff}

#boot{position:fixed;inset:0;z-index:99999;background:#070a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s;color:#e8ecf5}
#boot.off{opacity:0;pointer-events:none}
.logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#34d399,#0ea5e9);display:grid;place-items:center;font-size:44px;box-shadow:0 0 60px rgba(52,211,153,.4);animation:pl 1.6s infinite}
@keyframes pl{50%{transform:scale(1.06)}}
.bar{width:180px;height:4px;border-radius:4px;background:#222a3a;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#34d399;transition:width 1.6s ease}

/* OOBE / Setup iniziale */
#oobe{position:fixed;inset:0;z-index:99990;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,18,.52);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:opacity .45s}
#oobe.show{display:flex}
#oobe.off{opacity:0;pointer-events:none}
.ob-card{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.55);padding:28px;display:flex;flex-direction:column;gap:20px;animation:pop .25s}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ob-brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.06em;font-size:13px;color:var(--mut)}
.ob-brand .mini-logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#0ea5e9);display:grid;place-items:center;font-size:18px;color:#04130d}
.ob-dots{display:flex;gap:6px}
.ob-dots i{width:22px;height:4px;border-radius:4px;background:var(--line);transition:all .25s}
.ob-dots i.on{background:var(--acc);width:32px}
.ob-body{display:flex;flex-direction:column;gap:16px;min-height:230px}
.ob-title{font-size:24px;font-weight:600;line-height:1.2}
.ob-sub{color:var(--mut);font-size:14px}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.lang-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--hov);cursor:pointer;text-align:left;transition:all .15s}
.lang-btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.lang-btn.sel{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc);font-weight:600}
.lang-btn .fl-ico{font-size:22px}
.ob-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--hov);outline:0;font-size:15px}
.ob-input:focus{border-color:var(--acc)}
.ob-sec h5{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:8px}
.ob-foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line);gap:10px}
.ob-btn{border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--hov);transition:all .15s}
.ob-btn:hover{filter:brightness(1.12)}
.ob-btn.pri{background:var(--acc);color:#04130d}
.ob-btn[disabled]{opacity:.35;pointer-events:none}
.ob-summary{background:var(--hov);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.ob-summary div{display:flex;justify-content:space-between;gap:12px}
.ob-summary span{color:var(--mut)}

/* Windows Update Stile Win 10/11 */
.wu-box{background:var(--hov);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wu-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wu-btn{border:0;border-radius:8px;padding:8px 14px;background:#0078D4;color:#fff;font-weight:600;cursor:pointer;transition:all .15s}
.wu-btn:hover{filter:brightness(1.12)}
.wu-btn:disabled{opacity:.5;pointer-events:none}
.wu-btn.reboot{background:#107C10}
.wu-det{border-top:1px solid var(--line);padding-top:10px;font-size:13px;display:none}
.wu-det strong{color:var(--acc);display:block;margin-bottom:4px}
.wu-pbar-wrap{width:100%;height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:none}
.wu-pbar{height:100%;width:0;background:#0078D4;transition:width .35s ease}
#wu-reboot{position:fixed;inset:0;z-index:100001;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.wu-spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:#0078D4;border-radius:50%;animation:wuspin 1s linear infinite}
@keyframes wuspin{to{transform:rotate(360deg)}}

/* apps */
.term div{white-space:pre-wrap}.term{background:#0a0d14;color:#d5f5e3;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;height:100%;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .pr{color:var(--acc)}.term input{background:transparent;border:0;outline:0;width:70%;font:inherit;color:inherit;user-select:text}
.note{display:flex;flex-direction:column;height:100%}
.note textarea{flex:1;border:0;outline:0;resize:none;padding:12px;background:transparent;line-height:1.6;user-select:text}
.bar2{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar2 input{flex:1;min-width:80px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--hov);outline:0}
.b{border:0;border-radius:8px;padding:6px 10px;background:var(--hov);cursor:pointer}.b:hover{background:var(--acc);color:#04130d}
.st{color:var(--mut);font-size:12px;padding:4px 10px}
.fl{padding:6px}.fi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}.fi:hover{background:var(--hov)}.fi .e{font-size:20px}.fi .n{flex:1}.fi .d{color:var(--mut);border:0;background:none;cursor:pointer}.fi .d:hover{color:#e5484d}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;height:100%;grid-template-rows:auto repeat(5,1fr)}
.calc .scr{grid-column:1/5;text-align:right;font-size:30px;padding:10px;background:var(--hov);border-radius:10px;overflow:hidden;min-height:60px;word-break:break-all}.calc .scr small{display:block;color:var(--mut);font-size:12px;min-height:16px}
.calc button{border:0;border-radius:10px;background:var(--hov);cursor:pointer;font-size:18px}.calc button:hover{filter:brightness(1.3)}.calc .o{background:color-mix(in srgb,var(--acc) 30%,transparent)}.calc .eq{background:var(--acc);color:#04130d;font-weight:700}
.set{padding:16px;display:flex;flex-direction:column;gap:16px}.set h4{margin-bottom:8px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.s{border-color:var(--txt)}
.wp{width:80px;height:50px;border-radius:8px;cursor:pointer;border:3px solid transparent}.wp.s{border-color:var(--acc)}
.clk{display:grid;place-items:center;height:100%;text-align:center}.clk b{font-size:44px;font-weight:300;display:block}
@media (max-width:700px){
  .ico{width:72px}
  #tasks{max-width:calc(100vw - 230px)}
}

#wg{position:fixed;right:22px;top:calc(var(--tb-top) + 18px);text-align:right;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none;z-index:0}#wg b{display:block;font-size:54px;font-weight:200;line-height:1}#wg span{font-size:14px;opacity:.85}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99998}

#qs,#cm{position:fixed;display:none;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:14px;z-index:9002;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#qs{right:10px;top:calc(var(--tb-top) + 8px);width:min(300px,calc(100vw - 20px));flex-direction:column;gap:10px}#qs.show{display:flex}
#qs .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}#qs .b{padding:12px 8px;text-align:center}#qs input[type=range]{width:100%;accent-color:var(--acc)}
#cm{min-width:190px;padding:6px}#cm.show{display:block}#cm div{padding:8px 12px;border-radius:8px;cursor:pointer}#cm div:hover{background:var(--hov)}

.wbw{display:flex;flex-direction:column;height:100%}.tabs{display:flex;gap:2px;padding:4px 6px 0;background:var(--panel);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;max-width:170px;padding:6px 10px;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px;background:transparent;white-space:nowrap}
.tab.on{background:var(--win)}.tab span{overflow:hidden;text-overflow:ellipsis}.tab i{font-style:normal;opacity:.6}.tab i:hover{opacity:1;color:#e5484d}
.tbar{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex:none}.tbar input,.tbar select{padding:6px 10px;border-radius:18px;border:1px solid var(--line);background:var(--hov);outline:0;min-width:0}
.tbar input{flex:1}.tbar input:focus{border-color:var(--acc)}.tbar select{border-radius:8px}.tbar .b{padding:6px 9px}
.view{flex:1;min-height:0;position:relative;overflow:auto}.view iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.ban{flex:none;padding:5px 10px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}.ban a{color:var(--acc);cursor:pointer;text-decoration:underline}
.hm{display:flex;flex-direction:column;align-items:center;gap:22px;padding:36px 16px}.hm h2{font-weight:300;font-size:30px}.hm form{display:flex;width:min(520px,100%);gap:6px}.hm input{flex:1;padding:12px 18px;border-radius:26px;border:1px solid var(--line);background:var(--hov);outline:0;font-size:15px}.hm input:focus{border-color:var(--acc)}
.bm{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.bm a{display:block;width:96px;padding:12px 6px;text-align:center;border-radius:12px;background:var(--hov);cursor:pointer;font-size:12px}.bm a:hover{background:var(--acc);color:#04130d}.bm a .e{font-size:26px;display:block}
.cv{display:block;max-width:100%;background:#fff;touch-action:none;cursor:crosshair;margin:0 auto}.pt{height:100%;display:flex;flex-direction:column}.pt .vw{flex:1;overflow:auto;padding:8px;background:var(--hov)}
.bar2 input[type=color]{flex:none;min-width:0;width:34px;height:30px;padding:0;border:0;background:none}.bar2 input[type=range]{flex:none;min-width:0;width:90px;accent-color:var(--acc)}
.pk{display:flex;flex-wrap:wrap;gap:6px;padding:12px}.pk button{width:52px;height:80px;border-radius:8px;border:1px solid var(--line);background:#f4f4f6;color:#111;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}.pk button.k{background:#1b1f2c;color:#fff}.pk button:active{background:var(--acc);color:#04130d}
.cal{padding:12px}.cal .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;text-transform:capitalize}.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal .g div{padding:8px 0;border-radius:50%}.cal .g .hd2{color:var(--mut);font-size:11px;padding:4px 0}.cal .g .t{background:var(--acc);color:#04130d;font-weight:700}
</style>
</head>
<body>
<div id="boot"><div class="logo">🪶</div><div style="font-size:22px;letter-spacing:.12em;font-weight:600">ALERION OS</div><div class="bar"><i id="bi"></i></div></div>

<!-- Schermata di Riavvio per Aggiornamenti Windows Update -->
<div id="wu-reboot">
  <div class="wu-spin"></div>
  <h2 id="wu-rb-txt" style="font-weight:400;font-size:22px">Riavvio in corso</h2>
  <p id="wu-rb-sub" style="color:#8b94a8;font-size:13px">Non spegnere il dispositivo. L'operazione richiederà pochi istanti.</p>
</div>

<!-- Schermata di configurazione iniziale (OOBE) -->
<div id="oobe">
  <div class="ob-card">
    <div class="ob-top">
      <div class="ob-brand"><span class="mini-logo">🪶</span><span>ALERION OS SETUP</span></div>
      <div class="ob-dots" id="ob-dots"></div>
    </div>
    <div class="ob-body" id="ob-body"></div>
    <div class="ob-foot">
      <button class="ob-btn" id="ob-prev">←</button>
      <button class="ob-btn pri" id="ob-next">→</button>
    </div>
  </div>
</div>

<div id="wall" class="w0"></div>
<div id="icons"></div>
<div id="menu"><input id="q" placeholder="Cerca app…" autocomplete="off"><div id="apps"></div>
<div class="pw"><span id="usr">👤 Utente</span><span><button id="rs">↻ Riavvia</button><button id="sd">⏻ Spegni</button></span></div></div>

<!-- Taskbar in alto: Start a sinistra, app centrate, pillola e orologio a destra -->
<div id="tb">
  <button class="tbtn" id="start" title="Start">🪶</button>
  <div class="sp"></div>
  <div id="tasks"></div>
  <div id="clock"><b>--:--</b>--</div>
</div>

<div id="wg"><b>--:--</b><span></span></div>
<div id="dim"></div>
<div id="qs"></div>
<div id="cm"></div>
<div id="err"></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function getTopOffset(){
  var tb=$("#tb");
  return tb?Math.round(tb.getBoundingClientRect().bottom):56;
}

/* ---------- Versione OS persistente ("Per Sempre") ---------- */
var OS_VER=localStorage.getItem("alerion.ver")||"1.0";

/* ---------- Internazionalizzazione (i18n) ---------- */

$("#q").addEventListener("keydown",function(e){if(e.key==="Enter"){var f=$(".mi");if(f){hideMenu();open(f.dataset.i)}}});
document.addEventListener("click",hideAll);
document.addEventListener("keydown",function(e){if(e.key==="Escape")hideAll()});
function clock(){var n=new Date();$("#clock").innerHTML="<b>"+n.toLocaleTimeString(getLocale(),{hour:"2-digit",minute:"2-digit"})+"</b>"+n.toLocaleDateString(getLocale(),{day:"numeric",month:"short"})}
clock();setInterval(clock,10000);

/* ---------- OOBE (Configurazione iniziale guidata) ---------- */
var obStep=0;
function startOOBE(step){
 obStep=step||0;
 var ob=$("#oobe");
 ob.classList.remove("off");
 ob.classList.add("show");
 renderOOBE();
}
function finishOOBE(){
 var isFirst=!CFG.setupDone;
 CFG.setupDone=true;
 applyCfg();
 if(isFirst&&!localStorage.getItem("alerion.fs")){FS=defFS();save()}
 refreshUI();
 var ob=$("#oobe");
 ob.classList.add("off");
 setTimeout(function(){ob.classList.remove("show")},450);
}
function renderOOBE(){
 var dots=$("#ob-dots"),body=$("#ob-body"),prev=$("#ob-prev"),next=$("#ob-next");
 dots.innerHTML=[0,1,2,3].map(function(i){return '<i class="'+(i===obStep?"on":"")+'"></i>'}).join("");
 prev.textContent=tr("obBack");
 prev.disabled=(obStep===0);
 next.textContent=(obStep===3?tr("obStart"):tr("obNext"));

 if(obStep===0){
  body.innerHTML='<div class="ob-title">'+esc(tr("obStep1Title"))+'</div>'+
   '<div class="ob-sub">'+esc(tr("obStep1Sub"))+'</div>'+
   '<div class="lang-grid">'+LANGS.map(function(lg){
    return '<button class="lang-btn'+(CFG.lang===lg.code?" sel":"")+'" data-ob-lang="'+lg.code+'"><span class="fl-ico">'+lg.flag+'</span><span>'+esc(lg.name)+'</span></button>';
   }).join("")+'</div>';
 }else if(obStep===1){
  body.innerHTML='<div class="ob-title">'+esc(tr("obStep2Title"))+'</div>'+
   '<div class="ob-sub">'+esc(tr("obStep2Sub"))+'</div>'+
   '<input class="ob-input" id="ob-user-in" value="'+esc(CFG.user||"")+'" placeholder="'+esc(tr("obUserPlaceholder"))+'" autocomplete="off">'+
   '<div class="ob-sub" style="font-size:12px">'+esc(tr("obUserHint"))+'</div>';
  var inp=$("#ob-user-in",body);
  inp.addEventListener("input",function(){CFG.user=this.value});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){obStep++;renderOOBE()}});
  if(!coarse)setTimeout(function(){inp.focus();inp.select()},50);
 }else if(obStep===2){
  body.innerHTML='<div class="ob-title">'+esc(tr("obStep3Title"))+'</div>'+
   '<div class="ob-sub">'+esc(tr("obStep3Sub"))+'</div>'+
   '<div class="ob-sec"><h5>'+esc(tr("setTheme"))+'</h5><div class="row">'+[["auto",tr("themeAuto")],["dark",tr("themeDark")],["light",tr("themeLight")]].map(function(t){
    return '<button class="b" data-ob-theme="'+t[0]+'" style="'+(CFG.theme===t[0]?"background:var(--acc);color:#04130d;font-weight:600":"")+'">'+esc(t[1])+'</button>';
   }).join("")+'</div></div>'+
   '<div class="ob-sec"><h5>'+esc(tr("setAccent"))+'</h5><div class="row">'+ACC.map(function(c){
    return '<div class="sw'+(c===CFG.acc?" s":"")+'" data-ob-acc="'+c+'" style="background:'+c+'"></div>';
   }).join("")+'</div></div>'+
   '<div class="ob-sec"><h5>'+esc(tr("setWall"))+'</h5><div class="row">'+[0,1,2].map(function(i){
    return '<div class="wp w'+i+(i===CFG.wall?" s":"")+'" data-ob-wall="'+i+'"></div>';
   }).join("")+'</div></div>';
 }else if(obStep===3){
  var curLang=LANGS.find(function(x){return x.code===CFG.lang})||LANGS[1];
  var themeLbl=CFG.theme==="dark"?tr("themeDark"):CFG.theme==="light"?tr("themeLight"):tr("auto");
  body.innerHTML='<div class="ob-title">'+esc(tr("obStep4Title"))+'</div>'+
   '<div class="ob-sub">'+esc(tr("obStep4Sub"))+'</div>'+
   '<div class="ob-summary">'+
    '<div><span>'+esc(tr("obSumLang"))+'</span><b>'+curLang.flag+' '+esc(curLang.name)+'</b></div>'+
    '<div><span>'+esc(tr("obSumUser"))+'</span><b>👤 '+esc(userName())+'</b></div>'+
    '<div><span>'+esc(tr("obSumTheme"))+'</span><b>'+esc(themeLbl)+'</b></div>'+
   '</div>';
 }
}

$("#ob-body").addEventListener("click",function(e){
 var x=e.target.closest("[data-ob-lang],[data-ob-theme],[data-ob-acc],[data-ob-wall]");
 if(!x)return;
 if(x.dataset.obLang){CFG.lang=x.dataset.obLang;applyCfg();refreshUI();renderOOBE()}
 else if(x.dataset.obTheme){CFG.theme=x.dataset.obTheme;applyCfg();renderOOBE()}
 else if(x.dataset.obAcc){CFG.acc=x.dataset.obAcc;applyCfg();renderOOBE()}
 else if(x.dataset.obWall){CFG.wall=+x.dataset.obWall;applyCfg();renderOOBE()}
});
$("#ob-prev").onclick=function(){if(obStep>0){obStep--;renderOOBE()}};
$("#ob-next").onclick=function(){if(obStep<3){obStep++;renderOOBE()}else finishOOBE()};

/* ---------- Boot, Riavvio e Spegnimento ---------- */
function boot(){
 var b=$("#boot");
 b.classList.remove("off");
 var bi=$("#bi");
 if(bi){bi.style.transition="none";bi.style.width="0";void bi.offsetWidth;bi.style.transition="width 1.6s ease";bi.style.width="100%"}
 setTimeout(function(){
  b.classList.add("off");
  if(!CFG.setupDone)startOOBE(0);
 },1900);
}
$("#rs").onclick=function(){for(var k in W)close(k);hideAll();boot()};
$("#sd").onclick=function(){for(var k in W)close(k);hideAll();var b=$("#boot");b.classList.remove("off");b.innerHTML='<div style="color:#8b94a8;text-align:center">'+esc(tr("sysOff"))+'<br><br><button class="b" id="on" style="font-size:16px">'+esc(tr("powerOn"))+'</button></div>';
 $("#on").onclick=function(){b.innerHTML='<div class="logo">🪶</div><div style="font-size:22px;letter-spacing:.12em;font-weight:600">ALERION OS</div><div class="bar"><i id="bi"></i></div>';boot()}};

/* ---------- Widget, pannello rapido, menu contestuale ---------- */
function hideAll(){hideMenu();$("#qs").classList.remove("show");$("#cm").classList.remove("show")}
function wg(){var n=new Date();$("#wg b").textContent=n.toLocaleTimeString(getLocale(),{hour:"2-digit",minute:"2-digit"});$("#wg span").textContent=n.toLocaleDateString(getLocale(),{weekday:"long",day:"numeric",month:"long"})}
wg();setInterval(wg,10000);
function drawQS(){var q=$("#qs");q.innerHTML='<div class="g"><button class="b" data-q="th">'+(CFG.theme==="dark"?tr("dark"):CFG.theme==="light"?tr("light"):tr("auto"))+'</button><button class="b" data-q="fs">'+esc(tr("fullscreen"))+'</button><button class="b" data-q="wp">'+esc(tr("wallpaper"))+'</button><button class="b" data-q="st">'+esc(tr("settings"))+'</button></div><div>'+esc(tr("brightness"))+'<input type="range" min="0" max="60" value="'+Math.round((+$("#dim").style.opacity||0)*100)+'" data-q="br"></div><div class="st">'+new Date().toLocaleDateString(getLocale(),{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</div>'}
$("#clock").addEventListener("click",function(e){e.stopPropagation();var q=$("#qs"),on=!q.classList.contains("show");hideAll();if(on){drawQS();q.classList.add("show")}});
$("#qs").addEventListener("click",function(e){e.stopPropagation();var x=e.target.closest("[data-q]");if(!x)return;var k=x.dataset.q;
 if(k==="th"){CFG.theme={auto:"dark",dark:"light",light:"auto"}[CFG.theme]||"auto";applyCfg();drawQS()}
 else if(k==="fs"){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(er){}}
 else if(k==="wp"){CFG.wall=(CFG.wall+1)%3;applyCfg()}else if(k==="st"){hideAll();open("set")}});
$("#qs").addEventListener("input",function(e){if(e.target.dataset.q==="br")$("#dim").style.opacity=e.target.value/100});
document.addEventListener("contextmenu",function(e){
 if(e.target.closest(".win,#tb,#menu,#qs,#oobe"))return;
 e.preventDefault();hideAll();var c=$("#cm");
 var items=[[tr("cmNote"),function(){open("note")}],[tr("cmWeb"),function(){open("web")}],[tr("cmTerm"),function(){open("term")}],[tr("cmWall"),function(){CFG.wall=(CFG.wall+1)%3;applyCfg()}],[tr("cmSet"),function(){open("set")}]];
 c.innerHTML=items.map(function(m,i){return '<div data-m="'+i+'">'+esc(m[0])+'</div>'}).join("");
 c._items=items;
 c.classList.add("show");
 var minTop=getTopOffset()+6;
 c.style.left=Math.max(6,Math.min(e.clientX,innerWidth-c.offsetWidth-6))+"px";
 c.style.top=Math.max(minTop,Math.min(e.clientY,innerHeight-c.offsetHeight-6))+"px";
});
$("#cm").addEventListener("click",function(e){e.stopPropagation();var x=e.target.closest("[data-m]");hideAll();if(x&&this._items)this._items[+x.dataset.m][1]()});

// --- TRAY STILE PILLOLA ACCANTO ALL'OROLOGIO (SOLO ICONE WIFI + BATTERIA) ---
(function(){
  var clockEl=$("#clock");
  if(!clockEl||!clockEl.parentNode)return;

  var pill=document.createElement("div");
  pill.className="sys-pill";

  var wifiSvgOn='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4.9-2.3l1.4 1.4C9.4 16.4 10.6 16 12 16s2.6.4 3.5 1.1l1.4-1.4C15.6 14.6 13.9 14 12 14s-3.6.6-4.9 1.7zm-2.8-2.8l1.4 1.4C7.3 13.8 9.5 13 12 13s4.7.8 6.3 2.1l1.4-1.4C17.7 12 15 11 12 11s-5.7 1-7.7 2.9zm-2.9-2.8l1.4 1.4C4.9 10.9 8.2 9.5 12 9.5s7.1 1.4 9.3 3.2l1.4-1.4C20.1 9.1 16.3 7.5 12 7.5s-8.1 1.6-10.6 3.6z"/></svg>';
  var wifiSvgOff='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 14 0"/><path d="M2 9.5a15 15 0 0 1 11-4"/></svg>';

  var wifiEl=document.createElement("span");
  wifiEl.style.cssText="display:flex;align-items:center;opacity:.95";

  var batIcon=document.createElement("span");
  batIcon.style.cssText="display:flex;align-items:center;gap:2px";

  pill.appendChild(wifiEl);
  pill.appendChild(batIcon);

  clockEl.parentNode.insertBefore(pill,clockEl);

  function updNet(){
    var on=navigator.onLine;
    wifiEl.innerHTML=on?wifiSvgOn:wifiSvgOff;
    wifiEl.title=on?"Wi-Fi / Online":"Offline";
    wifiEl.style.opacity=on?".95":".45";
  }
  window.addEventListener("online",updNet);
  window.addEventListener("offline",updNet);
  updNet();

  function renderBat(lvl,charging){
    var p=Math.max(0,Math.min(100,lvl));
    var fillH=Math.round((p/100)*12);
    var y=17-fillH;
    var col=charging?"var(--acc)":(p<=20?"#e5484d":"currentColor");
    batIcon.title=(charging?"In carica - ":"Batteria: ")+p+"%";
    batIcon.innerHTML=
      '<svg width="14" height="18" viewBox="0 0 16 22" fill="none">'+
        '<rect x="5" y="1" width="6" height="2" rx="1" fill="currentColor"/>'+
        '<rect x="2.5" y="3.5" width="11" height="16.5" rx="2.2" stroke="currentColor" stroke-width="1.6"/>'+
        (fillH>0?'<rect x="4.5" y="'+(y+1)+'" width="7" height="'+Math.max(2,fillH)+'" rx="1" fill="'+col+'"/>':'')+
      '</svg>'+
      (charging?'<span style="font-size:10px;line-height:1">⚡</span>':'');
  }

  renderBat(100,false);
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){
      var sync=function(){renderBat(Math.round(b.level*100),b.charging)};
      sync();
      b.addEventListener("levelchange",sync);
      b.addEventListener("chargingchange",sync);
    }).catch(function(){});
  }
})();

applyCfg();
refreshUI();
boot();
})();
</script>
</body>
</html>
